<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Beating Heart Studio</title>
    <!-- Tailwind CSS for modern utility-first styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
        }
        /* Custom scrollbar for sidebar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col md:flex-row overflow-hidden bg-slate-950">

    <!-- Sidebar Control Panel -->
    <aside id="sidebar" class="w-full md:w-80 lg:w-96 bg-slate-900 border-r border-slate-800 flex flex-col z-20 shadow-2xl transition-transform duration-300 ease-in-out absolute md:relative inset-y-0 left-0 -translate-x-full md:translate-x-0">
        <div class="p-5 border-b border-slate-800 flex items-center justify-between bg-slate-900/80 backdrop-blur-md">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-500 shadow-inner">
                    <i class="fa-solid fa-heart-pulse text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-100 tracking-wide text-lg">Heart Studio</h1>
                    <p class="text-xs text-slate-400">Interactive 2D Canvas Engine</p>
                </div>
            </div>
            <button id="close-sidebar" class="md:hidden text-slate-400 hover:text-white p-2">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <!-- Controls container -->
        <div class="flex-1 overflow-y-auto p-5 space-y-6">
            
            <!-- Preset Selector -->
            <div class="space-y-2">
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center justify-between">
                    <span>Vibe Presets</span>
                </label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="applyPreset('classic')" class="px-3 py-2 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">Classic</button>
                    <button onclick="applyPreset('cyber')" class="px-3 py-2 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 transition">Cyber</button>
                    <button onclick="applyPreset('fire')" class="px-3 py-2 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 transition">Inferno</button>
                </div>
            </div>

            <hr class="border-slate-800">

            <!-- Heart Size Slider -->
            <div class="space-y-2">
                <div class="flex justify-between items-center text-sm">
                    <label for="heartSize" class="text-slate-300 font-medium flex items-center gap-2">
                        <i class="fa-solid fa-expand text-rose-400 w-4"></i> Size Scale
                    </label>
                    <span id="heartSizeVal" class="text-xs font-mono bg-slate-800 px-2 py-1 rounded text-rose-400">1.0x</span>
                </div>
                <input type="range" id="heartSize" min="0.5" max="2.0" step="0.1" value="1.0" class="w-full accent-rose-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
            </div>

            <!-- Heart Color Picker -->
            <div class="space-y-2">
                <div class="flex justify-between items-center text-sm">
                    <label for="heartColor" class="text-slate-300 font-medium flex items-center gap-2">
                        <i class="fa-solid fa-palette text-rose-400 w-4"></i> Primary Color
                    </label>
                    <span id="colorHex" class="text-xs font-mono bg-slate-800 px-2 py-1 rounded text-slate-300">#f43f5e</span>
                </div>
                <div class="flex items-center space-x-3">
                    <input type="color" id="heartColor" value="#f43f5e" class="w-12 h-10 rounded-lg bg-slate-800 border border-slate-700 cursor-pointer p-1">
                    <div class="flex-1 flex gap-2">
                        <button onclick="setColor('#f43f5e')" class="w-8 h-8 rounded-full bg-rose-500 border border-white/20 hover:scale-110 transition"></button>
                        <button onclick="setColor('#ec4899')" class="w-8 h-8 rounded-full bg-pink-500 border border-white/20 hover:scale-110 transition"></button>
                        <button onclick="setColor('#8b5cf6')" class="w-8 h-8 rounded-full bg-purple-500 border border-white/20 hover:scale-110 transition"></button>
                        <button onclick="setColor('#06b6d4')" class="w-8 h-8 rounded-full bg-cyan-500 border border-white/20 hover:scale-110 transition"></button>
                        <button onclick="setColor('#f59e0b')" class="w-8 h-8 rounded-full bg-amber-500 border border-white/20 hover:scale-110 transition"></button>
                    </div>
                </div>
            </div>

            <!-- Beat Frequency / Speed -->
            <div class="space-y-2">
                <div class="flex justify-between items-center text-sm">
                    <label for="beatFrequency" class="text-slate-300 font-medium flex items-center gap-2">
                        <i class="fa-solid fa-heart-pulse text-rose-400 w-4"></i> Beat Frequency
                    </label>
                    <span id="beatFrequencyVal" class="text-xs font-mono bg-slate-800 px-2 py-1 rounded text-rose-400">1.2 Hz</span>
                </div>
                <input type="range" id="beatFrequency" min="0.4" max="3.0" step="0.1" value="1.2" class="w-full accent-rose-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
            </div>

            <!-- Pulse Amplitude -->
            <div class="space-y-2">
                <div class="flex justify-between items-center text-sm">
                    <label for="pulseAmplitude" class="text-slate-300 font-medium flex items-center gap-2">
                        <i class="fa-solid fa-wave-square text-rose-400 w-4"></i> Pulse Intensity
                    </label>
                    <span id="pulseAmplitudeVal" class="text-xs font-mono bg-slate-800 px-2 py-1 rounded text-rose-400">15%</span>
                </div>
                <input type="range" id="pulseAmplitude" min="0.05" max="0.30" step="0.01" value="0.15" class="w-full accent-rose-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
            </div>

            <!-- Glow Intensity -->
            <div class="space-y-2">
                <div class="flex justify-between items-center text-sm">
                    <label for="glowIntensity" class="text-slate-300 font-medium flex items-center gap-2">
                        <i class="fa-solid fa-sun text-rose-400 w-4"></i> Glow Blur
                    </label>
                    <span id="glowIntensityVal" class="text-xs font-mono bg-slate-800 px-2 py-1 rounded text-rose-400">35px</span>
                </div>
                <input type="range" id="glowIntensity" min="5" max="70" step="5" value="35" class="w-full accent-rose-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
            </div>

            <!-- Particle Count -->
            <div class="space-y-2">
                <div class="flex justify-between items-center text-sm">
                    <label for="particleCount" class="text-slate-300 font-medium flex items-center gap-2">
                        <i class="fa-solid fa-sparkles text-rose-400 w-4"></i> Particle Count
                    </label>
                    <span id="particleCountVal" class="text-xs font-mono bg-slate-800 px-2 py-1 rounded text-rose-400">150</span>
                </div>
                <input type="range" id="particleCount" min="0" max="400" step="10" value="150" class="w-full accent-rose-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
            </div>

            <!-- Particle Speed -->
            <div class="space-y-2">
                <div class="flex justify-between items-center text-sm">
                    <label for="particleSpeed" class="text-slate-300 font-medium flex items-center gap-2">
                        <i class="fa-solid fa-wind text-rose-400 w-4"></i> Particle Speed
                    </label>
                    <span id="particleSpeedVal" class="text-xs font-mono bg-slate-800 px-2 py-1 rounded text-rose-400">1.0x</span>
                </div>
                <input type="range" id="particleSpeed" min="0.2" max="3.0" step="0.2" value="1.0" class="w-full accent-rose-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
            </div>

            <!-- Special Effects Toggles -->
            <div class="space-y-3 pt-2">
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Effects & Shading</label>
                
                <label class="flex items-center justify-between p-2.5 rounded-xl bg-slate-800/50 border border-slate-800 hover:bg-slate-800 cursor-pointer transition">
                    <span class="text-sm text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-circle-dot text-rose-400 w-4"></i> ECG Pulse Line
                    </span>
                    <input type="checkbox" id="showEcg" checked class="w-4 h-4 accent-rose-500 rounded cursor-pointer">
                </label>

                <label class="flex items-center justify-between p-2.5 rounded-xl bg-slate-800/50 border border-slate-800 hover:bg-slate-800 cursor-pointer transition">
                    <span class="text-sm text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-star text-rose-400 w-4"></i> Background Stars
                    </span>
                    <input type="checkbox" id="showStars" checked class="w-4 h-4 accent-rose-500 rounded cursor-pointer">
                </label>
            </div>

        </div>

        <!-- Sidebar Footer / Reset Button -->
        <div class="p-4 border-t border-slate-800 bg-slate-900/80">
            <button onclick="resetDefaults()" class="w-full py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium border border-slate-700 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-right"></i> Reset to Default
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950">
        
        <!-- Top Toolbar for Mobile Toggle & Info -->
        <header class="h-16 border-b border-slate-800/80 bg-slate-950/40 backdrop-blur-md px-6 flex items-center justify-between z-10">
            <div class="flex items-center space-x-4">
                <button id="open-sidebar" class="md:hidden text-slate-300 hover:text-white p-2 rounded-lg bg-slate-900 border border-slate-800">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <div class="flex items-center space-x-2">
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-xs uppercase tracking-wider font-semibold text-slate-400">Live Simulation Active</span>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button id="fullscreen-btn" class="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs font-medium text-slate-300 transition flex items-center gap-2">
                    <i class="fa-solid fa-expand"></i> <span class="hidden sm:inline">Fullscreen</span>
                </button>
            </div>
        </header>

        <!-- Canvas Container -->
        <div id="canvas-container" class="flex-1 relative flex items-center justify-center overflow-hidden cursor-crosshair">
            <canvas id="heartCanvas" class="absolute inset-0 w-full h-full block"></canvas>
            
            <!-- Overlay HUD / Instructions -->
            <div class="absolute bottom-6 left-6 pointer-events-none hidden sm:flex items-center gap-3 px-4 py-2 rounded-xl bg-slate-900/60 backdrop-blur-md border border-slate-800/80 text-xs text-slate-400 shadow-xl">
                <i class="fa-solid fa-circle-info text-rose-400"></i>
                <span>Move mouse over canvas to attract particles</span>
            </div>
        </div>
    </main>

    <!-- JavaScript Application Logic -->
    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        // Parameter control elements
        const controls = {
            size: document.getElementById('heartSize'),
            sizeVal: document.getElementById('heartSizeVal'),
            color: document.getElementById('heartColor'),
            colorHex: document.getElementById('colorHex'),
            frequency: document.getElementById('beatFrequency'),
            frequencyVal: document.getElementById('beatFrequencyVal'),
            amplitude: document.getElementById('pulseAmplitude'),
            amplitudeVal: document.getElementById('pulseAmplitudeVal'),
            glow: document.getElementById('glowIntensity'),
            glowVal: document.getElementById('glowIntensityVal'),
            particleCount: document.getElementById('particleCount'),
            particleCountVal: document.getElementById('particleCountVal'),
            particleSpeed: document.getElementById('particleSpeed'),
            particleSpeedVal: document.getElementById('particleSpeedVal'),
            showEcg: document.getElementById('showEcg'),
            showStars: document.getElementById('showStars')
        };

        // Mobile Sidebar toggles
        const sidebar = document.getElementById('sidebar');
        document.getElementById('open-sidebar').addEventListener('click', () => {
            sidebar.classList.remove('-translate-x-full');
        });
        document.getElementById('close-sidebar').addEventListener('click', () => {
            sidebar.classList.add('-translate-x-full');
        });

        // Fullscreen toggle
        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error("Error attempting to enable fullscreen:", err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        // Mouse coordinates for interactive particle attraction
        let mouse = { x: null, y: null, active: false };

        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
            mouse.active = true;
        });

        window.addEventListener('mouseleave', () => {
            mouse.active = false;
            mouse.x = null;
            mouse.y = null;
        });

        // Touch support
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                const rect = canvas.getBoundingClientRect();
                mouse.x = e.touches[0].clientX - rect.left;
                mouse.y = e.touches[0].clientY - rect.top;
                mouse.active = true;
            }
        }, { passive: true });

        window.addEventListener('touchend', () => {
            mouse.active = false;
        });

        let width, height, centerX, centerY;

        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        let stars = [];

        function initStars() {
            stars = [];
            const count = 80;
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5 + 0.5,
                    alpha: Math.random() * 0.7 + 0.2,
                    twinkleSpeed: Math.random() * 0.02 + 0.005
                });
            }
        }
        initStars();

        function getHeartPoint(t, scale) {
            // Parametric equations for a 2D heart
            // x = 16 * sin^3(t)
            // y = -(13 * cos(t) - 5 * cos(2t) - 2 * cos(3t) - cos(4t))
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            
            // Base scaling factor adjusted for canvas size
            const baseScale = Math.min(width, height) / 35;
            return {
                x: centerX + x * baseScale * scale,
                y: centerY + y * baseScale * scale + (height * 0.05) // slight offset downward for centering
            };
        }

        class Particle {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                // Pick a random angle along the heart curve parameter t [0, 2pi]
                this.t = Math.random() * Math.PI * 2;
                this.dest = getHeartPoint(this.t, 1.0);
                
                if (initial) {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                } else {
                    // Spawn near edges or random positions
                    this.x = centerX + (Math.random() - 0.5) * width;
                    this.y = centerY + (Math.random() - 0.5) * height;
                }

                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.size = Math.random() * 2.5 + 1;
                this.color = controls.color.value;
                this.alpha = Math.random() * 0.8 + 0.2;
                this.friction = 0.92;
                this.springFactor = 0.03 + Math.random() * 0.04;
            }

            update(beatScale, speedMultiplier) {
                const target = getHeartPoint(this.t, beatScale);

                // Spring force towards heart position
                const dx = target.x - this.x;
                const dy = target.y - this.y;
                
                this.vx += dx * this.springFactor * speedMultiplier;
                this.vy += dy * this.springFactor * speedMultiplier;

                this.vx *= this.friction;
                this.vy *= this.friction;

                this.x += this.vx;
                this.y += this.vy;

                // Mouse interaction repulsion/attraction
                if (mouse.active && mouse.x !== null) {
                    const mdx = mouse.x - this.x;
                    const mdy = mouse.y - this.y;
                    const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
                    if (mdist < 100) {
                        const angle = Math.atan2(mdy, mdx);
                        this.x -= Math.cos(angle) * 3;
                        this.y -= Math.sin(angle) * 3;
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = controls.color.value;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function updateParticlePool() {
            const targetCount = parseInt(controls.particleCount.value);
            while (particles.length < targetCount) {
                particles.push(new Particle());
            }
            while (particles.length > targetCount) {
                particles.pop();
            }
        }

        function setColor(hex) {
            controls.color.value = hex;
            controls.colorHex.textContent = hex;
            updateUIValues();
        }

        function applyPreset(type) {
            if (type === 'classic') {
                setColor('#f43f5e');
                controls.size.value = 1.0;
                controls.frequency.value = 1.2;
                controls.amplitude.value = 0.15;
                controls.glow.value = 35;
                controls.particleCount.value = 180;
                controls.particleSpeed.value = 1.0;
            } else if (type === 'cyber') {
                setColor('#06b6d4');
                controls.size.value = 1.2;
                controls.frequency.value = 1.8;
                controls.amplitude.value = 0.22;
                controls.glow.value = 50;
                controls.particleCount.value = 250;
                controls.particleSpeed.value = 1.5;
            } else if (type === 'fire') {
                setColor('#f59e0b');
                controls.size.value = 1.1;
                controls.frequency.value = 2.2;
                controls.amplitude.value = 0.20;
                controls.glow.value = 45;
                controls.particleCount.value = 300;
                controls.particleSpeed.value = 2.0;
            }
            updateUIValues();
            updateParticlePool();
        }

        function resetDefaults() {
            applyPreset('classic');
        }

        function updateUIValues() {
            controls.sizeVal.textContent = parseFloat(controls.size.value).toFixed(1) + 'x';
            controls.colorHex.textContent = controls.color.value;
            controls.frequencyVal.textContent = parseFloat(controls.frequency.value).toFixed(1) + ' Hz';
            controls.amplitudeVal.textContent = Math.round(parseFloat(controls.amplitude.value) * 100) + '%';
            controls.glowVal.textContent = controls.glow.value + 'px';
            controls.particleCountVal.textContent = controls.particleCount.value;
            controls.particleSpeedVal.textContent = parseFloat(controls.particleSpeed.value).toFixed(1) + 'x';
        }

        // Bind control listeners
        Object.values(controls).forEach(ctrl => {
            if (ctrl && ctrl.type && ctrl.type !== 'checkbox') {
                ctrl.addEventListener('input', () => {
                    updateUIValues();
                    updateParticlePool();
                });
            }
        });

        controls.color.addEventListener('input', () => {
            controls.colorHex.textContent = controls.color.value;
        });

        updateParticlePool();

        let time = 0;

        function drawEcgLine(beatScale) {
            if (!controls.showEcg.checked) return;
            
            ctx.save();
            ctx.strokeStyle = controls.color.value;
            ctx.lineWidth = 2;
            ctx.shadowColor = controls.color.value;
            ctx.shadowBlur = 10;
            ctx.globalAlpha = 0.4;

            const lineY = height - 50;
            const segmentWidth = width;
            const pointsCount = 200;
            const step = segmentWidth / pointsCount;

            ctx.beginPath();
            for (let i = 0; i <= pointsCount; i++) {
                const x = i * step;
                // Create ECG pulse wave pattern synchronized with time
                const progress = (x - (time * 100) % segmentWidth) / segmentWidth;
                let yOffset = 0;
                
                const pulsePhase = Math.abs((progress * 4) % 1 - 0.5);
                if (pulsePhase < 0.1) {
                    yOffset = -Math.sin(pulsePhase * Math.PI * 10) * 40 * (beatScale - 1);
                }

                const y = lineY + yOffset;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.restore();
        }

        function animate() {
            // Clear canvas with subtle trailing effect for motion blur
            ctx.fillStyle = 'rgba(10, 15, 30, 0.25)';
            ctx.fillRect(0, 0, width, height);

            // Draw background stars
            if (controls.showStars.checked) {
                ctx.save();
                stars.forEach(star => {
                    star.alpha += star.twinkleSpeed;
                    if (star.alpha > 0.9 || star.alpha < 0.2) star.twinkleSpeed *= -1;
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.restore();
            }

            // Calculate heart beat pulse scaling
            const freq = parseFloat(controls.frequency.value);
            const amp = parseFloat(controls.amplitude.value);
            const baseSize = parseFloat(controls.size.value);

            // Realistic double-beat rhythm simulation (lub-dub)
            time += 0.016 * freq;
            const heartbeat = Math.sin(time * Math.PI * 2);
            const heartbeatSecondary = Math.sin(time * Math.PI * 4 + 0.5) * 0.4;
            const beatScale = baseSize * (1 + (Math.max(0, heartbeat) + Math.max(0, heartbeatSecondary)) * amp);

            // Draw glowing core heart shape
            ctx.save();
            ctx.beginPath();
            const resolution = 150;
            for (let i = 0; i <= resolution; i++) {
                const t = (i / resolution) * Math.PI * 2;
                const pt = getHeartPoint(t, beatScale);
                if (i === 0) ctx.moveTo(pt.x, pt.y);
                else ctx.lineTo(pt.x, pt.y);
            }
            ctx.closePath();

            // Fill with glowing aura
            ctx.shadowColor = controls.color.value;
            ctx.shadowBlur = parseInt(controls.glow.value);
            ctx.fillStyle = controls.color.value;
            ctx.globalAlpha = 0.15;
            ctx.fill();

            // Inner solid stroke
            ctx.strokeStyle = controls.color.value;
            ctx.lineWidth = 2.5;
            ctx.globalAlpha = 0.8;
            ctx.stroke();
            ctx.restore();

            // Update and render particles
            const speedMult = parseFloat(controls.particleSpeed.value);
            particles.forEach(p => {
                p.update(beatScale, speedMult);
                p.draw();
            });

            // Draw ECG bottom readout line
            drawEcgLine(beatScale);

            requestAnimationFrame(animate);
        }

        // Start animation loop on window load
        window.onload = function() {
            updateUIValues();
            animate();
        };
    </script>
