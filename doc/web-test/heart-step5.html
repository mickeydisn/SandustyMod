<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Heart Canvas Studio</title>
<style>
  :root {
    --bg: #0b0d1a;
    --panel: #141833;
    --panel-2: #1b2147;
    --accent: #ff4d6d;
    --accent-2: #ff8fa3;
    --text: #e7e9ff;
    --muted: #9aa0c7;
    --border: #2a3060;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  #app {
    display: flex;
    height: 100vh;
    width: 100vw;
  }

  /* ---------- Left menu ---------- */
  #menu {
    width: 300px;
    min-width: 300px;
    height: 100%;
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border-right: 1px solid var(--border);
    padding: 20px 18px;
    overflow-y: auto;
    box-shadow: 4px 0 18px rgba(0, 0, 0, 0.35);
  }

  #menu h1 {
    font-size: 18px;
    margin: 0 0 4px;
    color: var(--accent-2);
    letter-spacing: 0.5px;
  }

  #menu p.subtitle {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 18px;
  }

  .field { margin-bottom: 16px; }

  .field label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--text);
    margin-bottom: 6px;
  }

  .field label .value {
    color: var(--accent);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid #fff2;
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid #fff2;
  }

  input[type="color"] {
    width: 100%;
    height: 34px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    cursor: pointer;
    padding: 2px;
  }

  select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }

  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    padding: 8px 0;
  }

  .switch {
    position: relative;
    width: 42px;
    height: 22px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider-toggle {
    position: absolute;
    inset: 0;
    background: var(--border);
    border-radius: 22px;
    transition: 0.25s;
    cursor: pointer;
  }
  .slider-toggle::before {
    content: "";
    position: absolute;
    height: 16px;
    width: 16px;
    left: 3px;
    top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: 0.25s;
  }
  .switch input:checked + .slider-toggle { background: var(--accent); }
  .switch input:checked + .slider-toggle::before { transform: translateX(20px); }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 18px 0;
  }

  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin: 0 0 12px;
  }

  button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.2s ease, transform 0.05s ease;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(0.98); }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    margin-top: 10px;
  }

  /* ---------- Main panel ---------- */
  #stage {
    position: relative;
    flex: 1;
    height: 100%;
    background: radial-gradient(ellipse at center, #1a1040 0%, #06060f 70%);
    overflow: hidden;
  }

  #heartCanvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  #hint {
    position: absolute;
    left: 16px;
    bottom: 12px;
    font-size: 12px;
    color: var(--muted);
    pointer-events: none;
    user-select: none;
  }

  #fps {
    position: absolute;
    right: 16px;
    bottom: 12px;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<div id="app">
  <!-- ================= LEFT MENU / FORM ================= -->
  <aside id="menu">
    <h1>💖 Heart Studio</h1>
    <p class="subtitle">Tune the canvas animation</p>

    <p class="section-title">Appearance</p>

    <div class="field">
      <label for="color">Heart color</label>
      <input type="color" id="color" value="#ff2d55" />
    </div>

    <div class="field">
      <label for="glowColor">Glow color <span class="value" id="glowColorVal">#ff8fa3</span></label>
      <input type="color" id="glowColor" value="#ff8fa3" />
    </div>

    <div class="field">
      <label for="size">Size <span class="value" id="sizeVal">1.00</span></label>
      <input type="range" id="size" min="0.4" max="2.5" step="0.05" value="1" />
    </div>

    <div class="field">
      <label for="bgTheme">Background</label>
      <select id="bgTheme">
        <option value="space" selected>Space</option>
        <option value="sunset">Sunset</option>
        <option value="plain">Plain dark</option>
      </select>
    </div>

    <div class="divider"></div>
    <p class="section-title">Motion</p>

    <div class="field">
      <label for="beatSpeed">Beat speed <span class="value" id="beatSpeedVal">1.0×</span></label>
      <input type="range" id="beatSpeed" min="0.1" max="3" step="0.1" value="1" />
    </div>

    <div class="field">
      <label for="pulse">Pulse intensity <span class="value" id="pulseVal">0.10</span></label>
      <input type="range" id="pulse" min="0" max="0.4" step="0.01" value="0.1" />
    </div>

    <div class="field">
      <label for="spin">Spin speed <span class="value" id="spinVal">0.00</span></label>
      <input type="range" id="spin" min="-0.5" max="0.5" step="0.01" value="0" />
    </div>

    <div class="divider"></div>
    <p class="section-title">Effects</p>

    <div class="field">
      <label for="particles">Particle count <span class="value" id="particlesVal">120</span></label>
      <input type="range" id="particles" min="0" max="400" step="10" value="120" />
    </div>

    <div class="field">
      <label for="glow">Glow amount <span class="value" id="glowVal">30</span></label>
      <input type="range" id="glow" min="0" max="80" step="1" value="30" />
    </div>

    <div class="switch-row">
      <span>Show trail</span>
      <label class="switch">
        <input type="checkbox" id="trail" checked />
        <span class="slider-toggle"></span>
      </label>
    </div>

    <div class="switch-row">
      <span>Floating hearts</span>
      <label class="switch">
        <input type="checkbox" id="floaters" checked />
        <span class="slider-toggle"></span>
      </label>
    </div>

    <div class="switch-row">
      <span>Beat sound</span>
      <label class="switch">
        <input type="checkbox" id="sound" />
        <span class="slider-toggle"></span>
      </label>
    </div>

    <div class="divider"></div>
    <button id="randomize">🎲 Randomize</button>
    <button id="reset" class="secondary">Reset defaults</button>
  </aside>

  <!-- ================= MAIN PANEL / CANVAS ================= -->
  <main id="stage">
    <canvas id="heartCanvas"></canvas>
    <div id="hint">Move / click the stage to nudge the heart</div>
    <div id="fps">-- fps</div>
  </main>
</div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("heartCanvas");
  const ctx = canvas.getContext("2d");

  // ---------- Parameter state ----------
  const params = {
    color: "#ff2d55",
    glowColor: "#ff8fa3",
    size: 1,
    bgTheme: "space",
    beatSpeed: 1,
    pulse: 0.1,
    spin: 0,
    particles: 120,
    glow: 30,
    trail: true,
    floaters: true,
    sound: false,
  };
  const DEFAULTS = Object.assign({}, params);

  // ---------- Resize handling ----------
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);

  // ---------- Color helpers ----------
  function hexToRgb(hex) {
    const m = hex.replace("#", "");
    const bigint = parseInt(m.length === 3 ? m.split("").map(function (c) { return c + c; }).join("") : m, 16);
    return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
  }
  function rgba(hex, a) {
    const c = hexToRgb(hex);
    return "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")";
  }

  // Classic parametric heart curve.
  function heartPoint(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return { x: x, y: -y }; // flip so the point faces up
  }

  // ---------- Particles ----------
  let particles = [];
  function makeParticle() {
    return {
      angle: Math.random() * Math.PI * 2,
      speed: 0.4 + Math.random() * 1.2,
      radius: 14 + Math.random() * 90,
      size: 1 + Math.random() * 2.5,
      alpha: 0.25 + Math.random() * 0.6,
      twinkle: Math.random() * Math.PI * 2,
    };
  }
  function rebuildParticles() {
    particles = [];
    for (let i = 0; i < params.particles; i++) particles.push(makeParticle());
  }

  // ---------- Floating mini hearts ----------
  let floaters = [];
  function makeFloater() {
    return {
      x: Math.random() * W,
      y: H + Math.random() * 200,
      size: 8 + Math.random() * 22,
      speed: 0.3 + Math.random() * 1.1,
      drift: (Math.random() - 0.5) * 0.6,
      alpha: 0.15 + Math.random() * 0.35,
      rot: (Math.random() - 0.5) * 0.6,
      phase: Math.random() * Math.PI * 2,
    };
  }
  function rebuildFloaters() {
    floaters = [];
    for (let i = 0; i < 24; i++) floaters.push(makeFloater());
  }

  function drawMiniHeart(x, y, s, alpha, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s / 16, s / 16);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i <= 64; i++) {
      const p = heartPoint((i / 64) * Math.PI * 2);
      if (i === 0) ctx.moveTo(p.x, p.y - 4); else ctx.lineTo(p.x, p.y - 4);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // ---------- Interaction ----------
  let pointer = { x: 0, y: 0, active: false };
  function updatePointer(e) {
    const rect = canvas.getBoundingClientRect();
    pointer.x = e.clientX - rect.left;
    pointer.y = e.clientY - rect.top;
    pointer.active = true;
    if (e.type === "mousedown") burst(pointer.x, pointer.y);
  }
  canvas.addEventListener("mousemove", updatePointer);
  canvas.addEventListener("mousedown", updatePointer);
  canvas.addEventListener("mouseleave", function () { pointer.active = false; });

  let bursts = [];
  function burst(x, y) {
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 3;
      bursts.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        size: 1 + Math.random() * 2.5,
      });
    }
  }

  // ---------- Sound (WebAudio heartbeat) ----------
  let audioCtx = null;
  let lastBeatTime = 0;
  function playHeartbeat() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(90, now);
      osc.frequency.exponentialRampToValueAtTime(45, now + 0.15);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.25, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.2);
    } catch (err) { /* ignore audio errors */ }
  }

  // ---------- Animation loop ----------
  let time = 0;
  let lastTs = performance.now();
  let fpsAccum = 0, fpsFrames = 0;
  const fpsEl = document.getElementById("fps");
  let beatPhase = 0;

  function heartPath(r) {
    ctx.beginPath();
    const steps = 220;
    for (let i = 0; i <= steps; i++) {
      const p = heartPoint((i / steps) * Math.PI * 2);
      const px = p.x * r * 0.05;
      const py = p.y * r * 0.05;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function draw(ts) {
    const dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    time += dt;

    // fps meter
    fpsAccum += dt; fpsFrames++;
    if (fpsAccum >= 0.5) {
      fpsEl.textContent = Math.round(fpsFrames / fpsAccum) + " fps";
      fpsAccum = 0; fpsFrames = 0;
    }

    // ---- Background ----
    if (params.trail) {
      const bg = {
        space: "rgba(6,6,15,0.22)",
        sunset: "rgba(20,6,20,0.22)",
        plain: "rgba(11,13,26,0.22)",
      }[params.bgTheme];
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);
    } else {
      const grad = {
        space: ["#1a1040", "#06060f"],
        sunset: ["#3a1030", "#12060f"],
        plain: ["#141833", "#0b0d1a"],
      }[params.bgTheme];
      const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
      g.addColorStop(0, grad[0]);
      g.addColorStop(1, grad[1]);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    // ---- Floating hearts ----
    if (params.floaters) {
      for (const f of floaters) {
        f.y -= f.speed;
        f.x += Math.sin(time + f.phase) * f.drift;
        if (f.y < -40) { Object.assign(f, makeFloater()); f.y = H + 30; }
        drawMiniHeart(f.x, f.y, f.size, f.alpha, params.color);
      }
    }

    const cx = W / 2;
    const cy = H / 2;

    // ---- Particles orbiting the heart ----
    if (params.particles > 0) {
      for (const p of particles) {
        p.angle += p.speed * dt;
        p.twinkle += dt * 3;
        const px = cx + Math.cos(p.angle) * p.radius * params.size;
        const py = cy + Math.sin(p.angle) * p.radius * 0.6 * params.size;
        const tw = (Math.sin(p.twinkle) + 1) / 2;
        ctx.globalAlpha = p.alpha * (0.4 + tw * 0.6);
        ctx.fillStyle = params.glowColor;
        ctx.beginPath();
        ctx.arc(px, py, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // ---- Burst sparks ----
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.x += b.vx; b.y += b.vy;
      b.vy += 0.05;
      b.life -= dt * 1.5;
      if (b.life <= 0) { bursts.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(b.life, 0);
      ctx.fillStyle = params.glowColor;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ---- Beating scale (two-thump heartbeat) ----
    beatPhase += dt * params.beatSpeed;
    const cycle = beatPhase % (Math.PI * 2);
    const thump = function (center, width) { return Math.max(0, Math.cos(cycle - center) / width); };
    let beat = thump(0, 2.4) * 0.75 + thump(0.9, 2.6) * 0.5;
    beat = Math.max(beat, 0);
    const scale = params.size * (1 + beat * params.pulse * 4);

    // heartbeat sound on the strong thump
    if (params.sound && beat > 0.7 && ts - lastBeatTime > 220) {
      playHeartbeat();
      lastBeatTime = ts;
    }

    const baseR = 16 * scale;

    // pointer attraction
    let ox = 0, oy = 0;
    if (pointer.active) {
      const dx = pointer.x - cx, dy = pointer.y - cy;
      const dist = Math.hypot(dx, dy) || 1;
      const pull = Math.min(dist, 120) * 0.05;
      ox = (dx / dist) * pull;
      oy = (dy / dist) * pull;
    }

    ctx.save();
    ctx.translate(cx + ox, cy + oy);
    ctx.rotate(params.spin * time);

    // ---- Glow + heart ----
    ctx.shadowBlur = params.glow;
    ctx.shadowColor = rgba(params.glowColor, 0.9);

    const fillGrad = ctx.createRadialGradient(0, -baseR * 0.2, baseR * 0.1, 0, 0, baseR * 1.4);
    fillGrad.addColorStop(0, rgba(params.color, 1));
    fillGrad.addColorStop(1, rgba(params.glowColor, 0.35));
    ctx.fillStyle = fillGrad;
    heartPath(baseR);
    ctx.fill();

    ctx.lineWidth = Math.max(1.5, baseR * 0.08);
    ctx.strokeStyle = rgba(params.glowColor, 0.85);
    ctx.shadowBlur = params.glow * 0.6;
    heartPath(baseR);
    ctx.stroke();

    // inner shine
    ctx.shadowBlur = 0;
    const shine = ctx.createRadialGradient(-baseR * 0.3, -baseR * 0.35, 0, -baseR * 0.3, -baseR * 0.35, baseR * 0.7);
    shine.addColorStop(0, "rgba(255,255,255,0.35)");
    shine.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = shine;
    heartPath(baseR * 0.85);
    ctx.fill();

    ctx.restore();

    requestAnimationFrame(draw);
  }

  // ---------- Form wiring ----------
  function bindRange(id, key, fmt, onChange) {
    const el = document.getElementById(id);
    const out = document.getElementById(id + "Val");
    const apply = function () {
      params[key] = parseFloat(el.value);
      if (out) out.textContent = fmt ? fmt(params[key]) : el.value;
      if (onChange) onChange();
    };
    el.addEventListener("input", apply);
    return apply;
  }

  function bindColor(id, key) {
    const el = document.getElementById(id);
    el.addEventListener("input", function () { params[key] = el.value; });
  }

  const applySize = bindRange("size", "size", function (v) { return v.toFixed(2); });
  const applyBeat = bindRange("beatSpeed", "beatSpeed", function (v) { return v.toFixed(1) + "×"; });
  const applyPulse = bindRange("pulse", "pulse", function (v) { return v.toFixed(2); });
  const applySpin = bindRange("spin", "spin", function (v) { return v.toFixed(2); });
  const applyGlow = bindRange("glow", "glow", function (v) { return String(Math.round(v)); });
  const applyParticles = bindRange("particles", "particles", function (v) { return String(Math.round(v)); }, rebuildParticles);

  bindColor("color", "color");
  bindColor("glowColor", "glowColor");

  document.getElementById("bgTheme").addEventListener("change", function (e) { params.bgTheme = e.target.value; });
  document.getElementById("trail").addEventListener("change", function (e) { params.trail = e.target.checked; });
  document.getElementById("floaters").addEventListener("change", function (e) { params.floaters = e.target.checked; });
  document.getElementById("sound").addEventListener("change", function (e) {
    params.sound = e.target.checked;
    if (params.sound && audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  });

  // ---------- Randomize ----------
  const rnd = function (a, b) { return a + Math.random() * (b - a); };
  function randomHex() {
    const h = Math.floor(rnd(0, 360));
    const s = 0.85, l = 0.6;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = l - c / 2;
    let r, g, b;
    if (h < 60) { r = c; g = x; b = 0; }
    else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; }
    else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; }
    else { r = c; g = 0; b = x; }
    const to = function (v) { return Math.round((v + m) * 255).toString(16).padStart(2, "0"); };
    return "#" + to(r) + to(g) + to(b);
  }

  function syncUI() {
    document.getElementById("color").value = params.color;
    document.getElementById("glowColor").value = params.glowColor;
    document.getElementById("size").value = params.size;
    document.getElementById("bgTheme").value = params.bgTheme;
    document.getElementById("beatSpeed").value = params.beatSpeed;
    document.getElementById("pulse").value = params.pulse;
    document.getElementById("spin").value = params.spin;
    document.getElementById("particles").value = params.particles;
    document.getElementById("glow").value = params.glow;
    document.getElementById("trail").checked = params.trail;
    document.getElementById("floaters").checked = params.floaters;
    document.getElementById("sound").checked = params.sound;
    applySize(); applyBeat(); applyPulse(); applySpin(); applyGlow(); applyParticles();
  }

  document.getElementById("randomize").addEventListener("click", function () {
    params.color = randomHex();
    params.glowColor = randomHex();
    params.size = +rnd(0.7, 1.8).toFixed(2);
    params.beatSpeed = +rnd(0.6, 1.8).toFixed(1);
    params.pulse = +rnd(0.04, 0.22).toFixed(2);
    params.spin = +rnd(-0.15, 0.15).toFixed(2);
    params.particles = Math.round(rnd(60, 260) / 10) * 10;
    params.glow = Math.round(rnd(15, 60));
    rebuildParticles();
    syncUI();
  });

  document.getElementById("reset").addEventListener("click", function () {
    Object.assign(params, DEFAULTS);
    rebuildParticles();
    syncUI();
  });

  // ---------- Init ----------
  resize();
  rebuildParticles();
  rebuildFloaters();
  window.addEventListener("resize", rebuildFloaters);
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
