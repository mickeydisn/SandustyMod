<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heart Canvas Animation</title>
  <style>
    :root {
      --bg: #0f0f14;
      --panel: #1a1a24;
      --border: #2a2a3a;
      --accent: #ff4d6d;
      --text: #e8e8f0;
      --muted: #8a8a9a;
      --input-bg: #12121a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* ── Left sidebar ── */
    .sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      gap: 16px;
      overflow-y: auto;
    }

    .sidebar h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar h1 span {
      font-size: 1.4rem;
    }

    .sidebar p.desc {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.4;
      margin-top: -6px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .field label .value {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 8px rgba(255, 77, 109, 0.5);
    }

    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
      box-shadow: 0 0 8px rgba(255, 77, 109, 0.5);
    }

    input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input-bg);
      cursor: pointer;
      padding: 2px;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 2px;
    }

    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 6px;
    }

    select {
      width: 100%;
      height: 36px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0 10px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }

    select:focus {
      border-color: var(--accent);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .toggle-row span {
      font-size: 0.8rem;
      color: var(--text);
    }

    .switch {
      position: relative;
      width: 42px;
      height: 22px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 22px;
      cursor: pointer;
      transition: 0.25s;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.25s;
    }

    .switch input:checked + .slider {
      background: var(--accent);
    }

    .switch input:checked + .slider::before {
      transform: translateX(20px);
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    button {
      flex: 1;
      height: 36px;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    button:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary:hover {
      background: #33334a;
    }

    /* ── Main panel ── */
    .main {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #1a1020 0%, #0f0f14 70%);
      overflow: hidden;
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    .hint {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      color: var(--muted);
      opacity: 0.7;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h1><span>♥</span> Heart Animator</h1>
    <p class="desc">Adjust parameters to control the canvas heart animation in real time.</p>

    <form id="params" onsubmit="return false;">
      <!-- Size -->
      <div class="field">
        <label>Size <span class="value" id="val-size">1.0</span></label>
        <input type="range" id="size" min="0.4" max="2.0" step="0.05" value="1.0" />
      </div>

      <!-- Beat speed -->
      <div class="field">
        <label>Beat Speed <span class="value" id="val-speed">1.0</span></label>
        <input type="range" id="speed" min="0.2" max="3.0" step="0.1" value="1.0" />
      </div>

      <!-- Beat intensity -->
      <div class="field">
        <label>Beat Intensity <span class="value" id="val-intensity">0.15</span></label>
        <input type="range" id="intensity" min="0" max="0.4" step="0.01" value="0.15" />
      </div>

      <!-- Particle count -->
      <div class="field">
        <label>Particles <span class="value" id="val-particles">80</span></label>
        <input type="range" id="particles" min="0" max="200" step="5" value="80" />
      </div>

      <!-- Glow -->
      <div class="field">
        <label>Glow <span class="value" id="val-glow">25</span></label>
        <input type="range" id="glow" min="0" max="60" step="1" value="25" />
      </div>

      <!-- Color -->
      <div class="field">
        <label>Heart Color</label>
        <input type="color" id="color" value="#ff4d6d" />
      </div>

      <!-- Effect style -->
      <div class="field">
        <label>Effect Style</label>
        <select id="style">
          <option value="particles" selected>Particles</option>
          <option value="rings">Pulse Rings</option>
          <option value="both">Particles + Rings</option>
          <option value="solid">Solid Only</option>
        </select>
      </div>

      <!-- Trails -->
      <div class="toggle-row">
        <span>Motion Trails</span>
        <label class="switch">
          <input type="checkbox" id="trails" checked />
          <span class="slider"></span>
        </label>
      </div>

      <!-- Buttons -->
      <div class="btn-row">
        <button type="button" class="btn-secondary" id="btn-reset">Reset</button>
        <button type="button" class="btn-primary" id="btn-burst">Burst ♥</button>
      </div>
    </form>
  </aside>

  <main class="main">
    <canvas id="canvas"></canvas>
    <div class="hint">Move mouse to attract particles · Click for a burst</div>
  </main>

  <script>
    // ── DOM refs ──
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const $ = (id) => document.getElementById(id);

    // ── Parameters (live) ──
    const params = {
      size: 1.0,
      speed: 1.0,
      intensity: 0.15,
      particles: 80,
      glow: 25,
      color: "#ff4d6d",
      style: "particles",
      trails: true,
    };

    // Bind range inputs
    function bindRange(id, key, decimals = 2) {
      const el = $(id);
      const val = $("val-" + id);
      el.addEventListener("input", () => {
        params[key] = parseFloat(el.value);
        val.textContent = params[key].toFixed(decimals);
        if (key === "particles") rebuildParticles();
      });
    }
    bindRange("size", "size", 2);
    bindRange("speed", "speed", 1);
    bindRange("intensity", "intensity", 2);
    bindRange("particles", "particles", 0);
    bindRange("glow", "glow", 0);

    $("color").addEventListener("input", (e) => (params.color = e.target.value));
    $("style").addEventListener("change", (e) => (params.style = e.target.value));
    $("trails").addEventListener("change", (e) => (params.trails = e.target.checked));

    $("btn-reset").addEventListener("click", () => {
      $("size").value = 1.0; params.size = 1.0; $("val-size").textContent = "1.00";
      $("speed").value = 1.0; params.speed = 1.0; $("val-speed").textContent = "1.0";
      $("intensity").value = 0.15; params.intensity = 0.15; $("val-intensity").textContent = "0.15";
      $("particles").value = 80; params.particles = 80; $("val-particles").textContent = "80";
      $("glow").value = 25; params.glow = 25; $("val-glow").textContent = "25";
      $("color").value = "#ff4d6d"; params.color = "#ff4d6d";
      $("style").value = "particles"; params.style = "particles";
      $("trails").checked = true; params.trails = true;
      rebuildParticles();
    });

    $("btn-burst").addEventListener("click", () => spawnBurst());

    // ── Canvas size ──
    function resize() {
      const main = canvas.parentElement;
      canvas.width = main.clientWidth;
      canvas.height = main.clientHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // ── Heart parametric equation ──
    // Classic cardioid-ish heart: x = 16 sin³(t), y = 13 cos(t) − 5 cos(2t) − 2 cos(3t) − cos(4t)
    function heartPoint(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x: x * scale, y: y * scale };
    }

    // ── Particles ──
    let particles = [];
    const mouse = { x: null, y: null, active: false };

    function createParticle() {
      const t = Math.random() * Math.PI * 2;
      const base = heartPoint(t, 8 * params.size);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2 - 10;
      return {
        ox: base.x, // offset from center (heart shape)
        oy: base.y,
        x: cx + base.x + (Math.random() - 0.5) * 40,
        y: cy + base.y + (Math.random() - 0.5) * 40,
        vx: (Math.random() - 0.5) * 0.8,
        vy: (Math.random() - 0.5) * 0.8,
        life: 0.5 + Math.random() * 0.5,
        maxLife: 0.5 + Math.random() * 0.5,
        size: 1.5 + Math.random() * 2.5,
        angle: t,
      };
    }

    function rebuildParticles() {
      particles = [];
      for (let i = 0; i < params.particles; i++) {
        particles.push(createParticle());
      }
    }
    rebuildParticles();

    // ── Burst (extra particles) ──
    let burstParticles = [];
    function spawnBurst() {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2 - 10;
      for (let i = 0; i < 60; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        burstParticles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          size: 2 + Math.random() * 3,
        });
      }
    }

    // ── Mouse ──
    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
      mouse.active = true;
    });
    canvas.addEventListener("mouseleave", () => (mouse.active = false));
    canvas.addEventListener("click", () => spawnBurst());

    // ── Rings ──
    let rings = [];
    let lastRing = 0;

    // ── Animation loop ──
    let time = 0;
    function draw() {
      time += 0.016 * params.speed;

      // Clear / trail
      if (params.trails) {
        ctx.fillStyle = "rgba(15, 15, 20, 0.18)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      const cx = canvas.width / 2;
      const cy = canvas.height / 2 - 10;
      const beat = 1 + Math.sin(time * 4) * params.intensity;
      const scale = 8 * params.size * beat;

      // Glow
      if (params.glow > 0) {
        ctx.save();
        ctx.shadowBlur = params.glow * beat;
        ctx.shadowColor = params.color;
      }

      // Draw solid heart
      ctx.beginPath();
      for (let i = 0; i <= 200; i++) {
        const t = (i / 200) * Math.PI * 2;
        const p = heartPoint(t, scale);
        if (i === 0) ctx.moveTo(cx + p.x, cy + p.y);
        else ctx.lineTo(cx + p.x, cy + p.y);
      }
      ctx.closePath();
      ctx.fillStyle = params.color;
      ctx.fill();

      if (params.glow > 0) ctx.restore();

      // Pulse rings
      if (params.style === "rings" || params.style === "both") {
        if (time - lastRing > 0.7) {
          rings.push({ r: 0, alpha: 0.6 });
          lastRing = time;
        }
        rings = rings.filter((r) => r.alpha > 0.01);
        rings.forEach((r) => {
          r.r += 1.8 * params.speed;
          r.alpha *= 0.97;
          ctx.beginPath();
          ctx.arc(cx, cy, r.r * params.size * 4, 0, Math.PI * 2);
          ctx.strokeStyle = hexToRgba(params.color, r.alpha);
          ctx.lineWidth = 2;
          ctx.stroke();
        });
      }

      // Particles
      if (params.style === "particles" || params.style === "both") {
        // Keep particle count in sync
        while (particles.length < params.particles) particles.push(createParticle());
        while (particles.length > params.particles) particles.pop();

        particles.forEach((p) => {
          // Attraction to heart outline
          const target = heartPoint(p.angle + time * 0.3, scale * 0.95);
          const tx = cx + target.x;
          const ty = cy + target.y;

          p.vx += (tx - p.x) * 0.02;
          p.vy += (ty - p.y) * 0.02;

          // Mouse attraction
          if (mouse.active) {
            const dx = mouse.x - p.x;
            const dy = mouse.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            if (dist < 150) {
              p.vx += (dx / dist) * 0.4;
              p.vy += (dy / dist) * 0.4;
            }
          }

          p.vx *= 0.92;
          p.vy *= 0.92;
          p.x += p.vx;
          p.y += p.vy;

          p.life -= 0.004 * params.speed;
          if (p.life <= 0) {
            Object.assign(p, createParticle());
            p.x = cx + p.ox;
            p.y = cy + p.oy;
          }

          const alpha = Math.min(1, p.life * 1.5);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * beat, 0, Math.PI * 2);
          ctx.fillStyle = hexToRgba(params.color, alpha);
          ctx.fill();
        });
      }

      // Burst particles
      burstParticles = burstParticles.filter((b) => b.life > 0);
      burstParticles.forEach((b) => {
        b.x += b.vx;
        b.y += b.vy;
        b.vx *= 0.96;
        b.vy *= 0.96;
        b.life -= 0.015;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size * b.life, 0, Math.PI * 2);
        ctx.fillStyle = hexToRgba(params.color, b.life);
        ctx.fill();
      });

      requestAnimationFrame(draw);
    }

    function hexToRgba(hex, a) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r},${g},${b},${a})`;
    }

    draw();
  </script>
</body>
</html>
